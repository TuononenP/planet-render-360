# Manual release builds: Actions → Build → Run workflow.
# Signing material lives in the `release` environment's secrets (see README,
# "Building releases"); nothing secret is committed to this public repo.
name: Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to build
        type: choice
        options: [both, macos, ios]
        default: both
      macos_signing:
        description: macOS signing
        type: choice
        options: [adhoc, notarized]
        default: adhoc
      version:
        description: Version (CFBundleShortVersionString)
        type: string
        default: "0.1.0"
      testflight:
        description: Upload the iOS build to TestFlight (off = .ipa artifact only)
        type: boolean
        default: true

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version }}
  # BUILD_NUMBER is set by each job's first step: TestFlight needs a
  # higher build number on every upload, and run_attempt keeps a re-run
  # from reusing the previous attempt's number (GitHub expressions have
  # no arithmetic).

jobs:
  macos:
    if: inputs.platform != 'ios'
    runs-on: macos-15
    timeout-minutes: 90
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          # Map packs and OSM snapshots are Git LFS objects.
          lfs: true
      - name: Compute build number
        run: echo "BUILD_NUMBER=$(( ${{ github.run_number }} * 100 + ${{ github.run_attempt }} ))" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-godot

      - name: Import Developer ID certificate
        if: inputs.macos_signing == 'notarized'
        env:
          P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS="$(uuidgen)"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/asc_key.p8"

      - name: Build macOS app
        env:
          MACOS_SIGN_IDENTITY: ${{ inputs.macos_signing == 'notarized' && secrets.MACOS_SIGN_IDENTITY || '' }}
          ASC_KEY_ID: ${{ inputs.macos_signing == 'notarized' && secrets.ASC_KEY_ID || '' }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/asc_key.p8
        run: |
          tools/build_macos.sh
          mkdir -p "$RUNNER_TEMP/dist"
          mv ../build/macos/PlanetRender360.dmg "$RUNNER_TEMP/dist/PlanetRender360-$VERSION-$BUILD_NUMBER.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: PlanetRender360-macos-${{ inputs.version }}-${{ env.BUILD_NUMBER }}
          path: ${{ runner.temp }}/dist/*.dmg
          if-no-files-found: error

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/asc_key.p8"

  ios:
    if: inputs.platform != 'macos'
    runs-on: macos-15
    timeout-minutes: 90
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          # Map packs and OSM snapshots are Git LFS objects.
          lfs: true
      - name: Compute build number
        run: echo "BUILD_NUMBER=$(( ${{ github.run_number }} * 100 + ${{ github.run_attempt }} ))" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-godot

      - name: Write App Store Connect key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/asc_key.p8"

      - name: Build iOS app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/asc_key.p8
          IOS_UPLOAD: ${{ inputs.testflight && '1' || '0' }}
        run: |
          tools/build_ios_release.sh
          if [ "$IOS_UPLOAD" = "0" ]; then
            mkdir -p "$RUNNER_TEMP/dist"
            mv ../build/ios/export/*.ipa "$RUNNER_TEMP/dist/PlanetRender360-$VERSION-$BUILD_NUMBER.ipa"
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.testflight }}
        with:
          name: PlanetRender360-ios-${{ inputs.version }}-${{ env.BUILD_NUMBER }}
          path: ${{ runner.temp }}/dist/*.ipa
          if-no-files-found: error

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/asc_key.p8"
