name: Set up Godot
description: Install Godot and its export templates (cached), then import the project.
inputs:
  version:
    description: Godot release, e.g. 4.7.2
    default: "4.7.2"
runs:
  using: composite
  steps:
    - name: Cache Godot and export templates
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          ${{ runner.temp }}/godot
          ~/Library/Application Support/Godot/export_templates/${{ inputs.version }}.stable
        key: godot-${{ runner.os }}-${{ inputs.version }}

    - name: Download Godot and export templates
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        BASE=https://github.com/godotengine/godot-builds/releases/download/${{ inputs.version }}-stable
        mkdir -p "$RUNNER_TEMP/godot"
        curl -fsSL -o "$RUNNER_TEMP/godot.zip" "$BASE/Godot_v${{ inputs.version }}-stable_macos.universal.zip"
        unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
        curl -fsSL -o "$RUNNER_TEMP/templates.tpz" "$BASE/Godot_v${{ inputs.version }}-stable_export_templates.tpz"
        unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/tpz"
        DEST="$HOME/Library/Application Support/Godot/export_templates/${{ inputs.version }}.stable"
        mkdir -p "$DEST"
        mv "$RUNNER_TEMP"/tpz/templates/* "$DEST/"

    - name: Put godot on PATH and import the project
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/bin"
        ln -sf "$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot" "$RUNNER_TEMP/bin/godot"
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
        # A fresh checkout has no .godot/; class_names only resolve after an import.
        "$RUNNER_TEMP/bin/godot" --headless --path . --import
