name: Set up Godot
description: Install Godot and its export templates (cached), then import the project.
inputs:
  version:
    description: Godot release, e.g. 4.7.2
    default: "4.7.2"
runs:
  using: composite
  steps:
    # Restore and save are separate steps: actions/cache only saves when the
    # whole job succeeds, so failing tests would re-download Godot every run.
    - name: Restore Godot and export templates
      id: cache
      uses: actions/cache/restore@v6
      with:
        path: |
          ${{ runner.temp }}/godot
          ~/Library/Application Support/Godot/export_templates/${{ inputs.version }}.stable
        key: godot-${{ runner.os }}-${{ inputs.version }}

    - name: Download Godot and export templates
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        BASE=https://github.com/godotengine/godot-builds/releases/download/${{ inputs.version }}-stable
        mkdir -p "$RUNNER_TEMP/godot"
        curl -fsSL -o "$RUNNER_TEMP/godot.zip" "$BASE/Godot_v${{ inputs.version }}-stable_macos.universal.zip"
        unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
        curl -fsSL -o "$RUNNER_TEMP/templates.tpz" "$BASE/Godot_v${{ inputs.version }}-stable_export_templates.tpz"
        unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/tpz"
        DEST="$HOME/Library/Application Support/Godot/export_templates/${{ inputs.version }}.stable"
        mkdir -p "$DEST"
        mv "$RUNNER_TEMP"/tpz/templates/* "$DEST/"

    - name: Save Godot and export templates
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          ${{ runner.temp }}/godot
          ~/Library/Application Support/Godot/export_templates/${{ inputs.version }}.stable
        key: godot-${{ runner.os }}-${{ inputs.version }}

    - name: Put godot on PATH and import the project
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/bin"
        # The self-hosted runner is a desktop Mac: go through tools/godot_bg.sh
        # so headless runs never activate Godot or take focus.
        cat > "$RUNNER_TEMP/bin/godot" <<EOF
        #!/bin/bash
        GODOT_BIN="$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot" exec "$GITHUB_WORKSPACE/tools/godot_bg.sh" "\$@"
        EOF
        chmod +x "$RUNNER_TEMP/bin/godot"
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
        # A fresh checkout has no .godot/; class_names only resolve after an import.
        # Godot has segfaulted mid-import here once (exit 139) and imported
        # cleanly on the next try, so a crash (exit >= 128) gets one retry.
        for attempt in 1 2; do
          rc=0
          "$RUNNER_TEMP/bin/godot" --headless --path . --import || rc=$?
          [ "$rc" -lt 128 ] && break
          echo "::warning::Godot crashed during import (exit $rc, attempt $attempt)"
        done
        exit "$rc"
